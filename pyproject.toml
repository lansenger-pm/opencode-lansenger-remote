[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-lansenger-remote"
version = "0.3.3"
description = "Control OpenCode from Lansenger (蓝信) personal bot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.urls]
Homepage = "https://github.com/anomalyco/opencode-lansenger-remote"
Repository = "https://github.com/anomalyco/opencode-lansenger-remote"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
opencode-lansenger = "opencode_lansenger_remote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"